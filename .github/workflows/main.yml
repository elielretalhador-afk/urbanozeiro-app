name: Build Android APK
"on":
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
      - name: Create google-services.json
        run: |
          echo "" | base64 -d > android/app/google-services.json
          
      - name: Baixar arquivos atualizados
        run: |
          curl -s https://dpaste.com/FNYZDQUYB.txt -o src/App.tsx
          curl -s https://dpaste.com/ACA5VAPU9.txt -o package.json
          curl -s https://dpaste.com/H4WKE4BT9.txt -o android/app/src/main/AndroidManifest.xml
          curl -s https://dpaste.com/34MPNHZGN.txt -o android/app/src/main/res/values/strings.xml
          curl -s https://dpaste.com/FT9MH38UD.txt -o android/variables.gradle
          curl -s https://dpaste.com/FLHW8X5RF.txt -o android/app/build.gradle
          
      - name: Install dependencies
        run: npm install
        
      - name: Build web
        run: npm run build
        
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          
      - name: Build APK
        run: cd android && gradle assembleDebug
        
      - name: Print Debug Signature
        run: cd android && gradle signingReport
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: urbanozeiro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
